<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>opsec.exe</title>
<style>
  :root{ --y:#ffd60a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}

  #static{
    position:fixed;inset:0;width:100%;height:100%;z-index:0;
    image-rendering:pixelated;
  }

  .stage{
    position:fixed;inset:0;z-index:2;
    display:flex;align-items:center;justify-content:center;
  }
  .frame{
    position:relative;width:576px;height:576px;
    max-width:92vw;max-height:92vw;
    border:2px solid var(--y);
    box-shadow:0 0 40px rgba(255,214,10,.35), inset 0 0 30px rgba(255,214,10,.08);
    background:#000;
  }
  .frame video{width:100%;height:100%;object-fit:cover;display:block}

  .corner{position:absolute;width:26px;height:26px;border:3px solid var(--y);z-index:3}
  .corner.tl{top:-10px;left:-10px;border-right:0;border-bottom:0}
  .corner.tr{top:-10px;right:-10px;border-left:0;border-bottom:0}
  .corner.bl{bottom:-10px;left:-10px;border-right:0;border-top:0}
  .corner.br{bottom:-10px;right:-10px;border-left:0;border-top:0}
</style>
</head>
<body>

<canvas id="static"></canvas>

<div class="stage">
  <div class="frame">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <video src="Fun/funone.mp4" autoplay muted loop playsinline></video>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('static');
  const cx = cv.getContext('2d');
  let w, h, imgData;

  function resize(){
    w = cv.width = Math.floor(innerWidth / 3);
    h = cv.height = Math.floor(innerHeight / 3);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    imgData = cx.createImageData(w, h);
  }
  resize();
  addEventListener('resize', resize);

  function draw(){
    const buf = imgData.data;
    for (let i = 0; i < buf.length; i += 4) {
      const v = Math.random() * 255 | 0;
      buf[i] = v; buf[i+1] = v; buf[i+2] = v; buf[i+3] = 255;
    }
    cx.putImageData(imgData, 0, 0);
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Fillesh Port</title>
<link rel="icon" href="icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600&family=Major+Mono+Display&display=swap" rel="stylesheet">
<style id="boot">html{background:#000}body{opacity:0}</style>
<style>
.gate .hint{position:absolute;left:0;right:0;bottom:calc(2rem + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font:500 12px/1 'Instrument Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);pointer-events:none}
</style>
</head>

<body>

<video id="bg" loop playsinline autoplay muted preload="auto" aria-hidden="true"></video>
<div class="grain" aria-hidden="true"></div>

<div class="gate wait" id="gate" role="dialog" aria-modal="true" aria-label="Enter">
  <button class="enter" id="enter" type="button">enter</button>
  <p class="hint">refresh the page for a different theme</p>
</div>

<div id="site" inert>
  <nav id="nv" aria-label="Sections"></nav>

  <main>
    <section id="home" class="scene home">
      <h1 class="name" id="name" aria-label="FILLESH" data-text="FILLESH">FILLESH</h1>
      <dl class="strip" id="strip"></dl>
    </section>

    <section id="work" class="scene work">
      <h2 class="title" id="t-work"></h2>
      <ul class="tracks" id="gl"></ul>
      <p class="note" id="wn"></p>
    </section>

    <section id="skills" class="scene skills">
      <h2 class="title" id="t-skills"></h2>
      <div id="sl"></div>
      <p class="note" id="also"></p>
    </section>

    <section id="contact" class="scene contact">
      <h2 class="title" id="t-contact"></h2>
      <ul id="ln"></ul>
      <p class="end" id="ed"></p>
    </section>
  </main>
</div>

<script src="themelist.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>

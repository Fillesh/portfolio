<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Fillesh Portfolio</title>
<link rel="icon" href="https://i.pinimg.com/736x/f7/1d/f9/f71df979342931a4154b9dd48fca8c9d.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="rn" aria-hidden="true"></canvas>
<div class="crt" aria-hidden="true"></div>

<header class="top">
  <a href="#home" class="brand" aria-label="Home"><span id="bp"></span><i class="blk"></i></a>
  <nav id="nv" aria-label="Sections"></nav>
</header>

<main>

<section id="home" class="hero">
  <div class="wrap">
    <div class="hero-text">
      <p class="prompt"><span class="ps1" id="hp"></span> <span id="cmd"></span></p>
      <h1 class="name glitch" id="name"></h1>
      <p class="role"><span class="ps1">&gt;</span> <span id="role" class="cyc"></span></p>
      <p class="lead" id="lead" data-t=""></p>
      <div class="cta reveal" id="cta">
        <a class="btn" href="#work">./view_work</a>
        <a class="btn alt" href="#contact">./contact_me</a>
      </div>
    </div>

    <figure class="frame reveal" id="hf">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="term">
        <div class="term-bar"><i></i><i></i><i></i><span>visits.live</span></div>
        <div class="term-body">
          <div class="cl">total visits contributed</div>
          <div class="cn" id="cn">0</div>
          <div class="cr"><span class="cl">Last sync</span><span id="ct">--:--:--</span></div>
          <div class="spk" id="sp" aria-hidden="true"></div>
        </div>
        <div class="scan"></div>
      </div>
      <figcaption><span id="sj"></span><span class="rec">LIVE</span></figcaption>
    </figure>
  </div>
</section>

<section id="about" data-seq>
  <div class="wrap">
    <h2 class="sec-title"><span class="ps1 ps"></span><span data-t="cd ./about"></span></h2>
    <div class="about-grid">
      <aside class="idcard reveal">
        <div class="glyph" aria-hidden="true"><img src="https://www.image2url.com/r2/default/images/1790268207060-bc5c631f-6791-4a10-b1d1-f6028fec5147.jpg" alt="" style="width:100%;height:100%;object-fit:cover"></div>
        <dl id="il"></dl>
      </aside>
      <div class="term reveal" style="--d:.15s">
        <div class="term-bar"><i></i><i></i><i></i><span>about.txt</span></div>
        <div class="term-body about-lines" id="al"></div>
      </div>
    </div>
  </div>
</section>

<section id="skills" data-seq>
  <div class="wrap">
    <h2 class="sec-title"><span class="ps1 ps"></span><span data-t="./skills --list"></span></h2>
    <div class="skills" id="sl"></div>
    <p class="also" id="also"></p>
  </div>
</section>

<section id="priority" data-seq>
  <div class="wrap">
    <h2 class="sec-title"><span class="ps1 ps"></span><span data-t="tail -n 3 ~/priority.log"></span></h2>
    <div class="logs" id="fl"></div>
  </div>
</section>

<section id="work" data-seq>
  <div class="wrap">
    <h2 class="sec-title"><span class="ps1 ps"></span><span data-t="ls ./work"></span></h2>
    <div class="games" id="gl"></div>
    <p class="more">and much more!!</p>
  </div>
</section>

<section id="contact" data-seq>
  <div class="wrap">
    <h2 class="sec-title"><span class="ps1 ps"></span><span data-t="./reach_me.sh "></span></h2>
    <div class="contact-grid">
      <ul class="links reveal" id="ln"></ul>

      <div class="term reveal" id="tm" style="--d:.15s">
        <div class="term-bar"><i></i><i></i><i></i><span>cmdr</span></div>
        <div class="term-body">
          <div id="to">
            <div class="tline" data-t="Type 'help' to list commands."></div>
          </div>
          <label class="tin-row">
            <span class="ps1" id="tp"></span>
            <input id="ti" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input">
          </label>
        </div>
      </div>
    </div>
  </div>
</section>

</main>

<footer>
  <div class="wrap">
    <span class="quote cyc" id="qt"></span>
    <div class="end" id="ed"></div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
